services:
  app:
    command: python -m uvicorn server:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app:cached
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - hf_models:/app/tf_models
    environment:
      # 开发时通常直接连接宿主机上已启动的服务
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      MILVUS_HOST: ${MILVUS_HOST:-host.docker.internal}
      REDIS_URI: ${REDIS_URI:-redis://host.docker.internal:6379}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
