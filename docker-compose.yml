services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    restart: unless-stopped
    environment:
      # LLM 配置
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_MODEL_NAME: ${DASHSCOPE_MODEL_NAME:-gui-plus-2026-02-26}

      # Langfuse 监控（可选）
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}

      # Huggingface 模型路径
      HF_MODELS_PATH: /app/tf_models
      HF_HOME: /app/tf_models

      # 数据库配置（连接宿主机/外部服务）
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DBNAME: ${POSTGRES_DBNAME:-ragsystem}

      # Milvus 配置（连接宿主机/外部服务）
      MILVUS_HOST: ${MILVUS_HOST:-host.docker.internal}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_DB_NAME: ${MILVUS_DB_NAME:-ragsystem}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-root:Milvus}

      # Redis 配置（连接宿主机/外部服务）
      REDIS_URI: ${REDIS_URI:-redis://host.docker.internal:6379}

      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # 应用配置
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      # 持久化用户上传的文件
      - ./uploads:/app/uploads
      # 持久化日志
      - ./logs:/app/logs
      # 持久化 Huggingface 模型缓存
      - hf_models:/app/tf_models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'

volumes:
  hf_models:
    driver: local
