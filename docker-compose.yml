version: '3.8'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: docker.1ms.run/library/postgres:14
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DBNAME:-ragsystem}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DBNAME:-ragsystem}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Milvus 向量数据库服务
  milvus:
    image: docker.1ms.run/milvusdb/milvus:v2.6.13
    container_name: rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G

  # Redis 缓存服务（可选，当前未使用）
  # 如果未来需要缓存功能，可以取消注释
  # redis:
  #   image: docker.1ms.run/library/redis:8.6.2
  #   container_name: rag-redis
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - rag-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # RAG 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    restart: unless-stopped
    environment:
      # LLM 配置
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_MODEL_NAME: ${DASHSCOPE_MODEL_NAME:-gui-plus-2026-02-26}
      
      # Langfuse 监控（可选）
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      
      # Huggingface 模型路径
      HF_MODELS_PATH: /app/tf_models
      HF_HOME: /app/tf_models
      
      # 数据库配置
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DBNAME: ${POSTGRES_DBNAME:-ragsystem}
      
      # Milvus 配置
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_DB_NAME: ${MILVUS_DB_NAME:-ragsystem}
      
      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # 应用配置
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      # 持久化用户上传的文件
      - ./uploads:/app/uploads
      # 持久化日志
      - ./logs:/app/logs
      # 持久化 Huggingface 模型缓存
      - hf_models:/app/tf_models
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  milvus_data:
    driver: local
  hf_models:
    driver: local
  # redis_data:  # Redis 数据卷（当前未使用）
  #   driver: local
